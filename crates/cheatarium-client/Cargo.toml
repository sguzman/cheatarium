[package]
name = "cheatarium-client"
version = "0.1.0"
edition = "2021"
description = "Read-only, versioned Cheatarium console cheat index consumer for emulators"
license = "MIT OR Apache-2.0"
publish = false
autobins = false

[features]
default = []
desktop = ["dep:eframe"]

[dependencies]
eframe = { version = "0.32", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[[bin]]
name = "cheatarium-query"
path = "src/main.rs"

[[bin]]
name = "cheatarium-fingerprint"
path = "src/bin/fingerprint.rs"

[[bin]]
name = "cheatarium-inventory"
path = "src/bin/inventory.rs"

[[bin]]
name = "cheatarium-wii-local"
path = "src/bin/wii_local.rs"

[[bin]]
name = "cheatarium-eden-builds"
path = "src/bin/eden_builds.rs"

[[bin]]
name = "cheatarium-eden-plan"
path = "src/bin/eden_plan.rs"

[[bin]]
name = "cheatarium-eden-discover"
path = "src/bin/eden_discover.rs"

[[bin]]
name = "cheatarium-eden-curated-readiness"
path = "src/bin/eden_curated_readiness.rs"

[[bin]]
name = "cheatarium-eden-build-watch"
path = "src/bin/eden_build_watch.rs"

[[bin]]
name = "cheatarium-explorer"
path = "src/bin/explorer.rs"
required-features = ["desktop"]
