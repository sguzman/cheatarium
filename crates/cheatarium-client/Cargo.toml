[package]
name = "cheatarium-client"
version = "0.1.0"
edition = "2021"
description = "Read-only, versioned Cheatarium console cheat index consumer for emulators"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[[bin]]
name = "cheatarium-query"
path = "src/main.rs"
