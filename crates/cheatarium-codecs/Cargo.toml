[package]
name = "cheatarium-codecs"
version = "0.1.0"
edition = "2021"
description = "Offline, side-effect-free console cheat-code decoders"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "cheatarium-decode"
path = "src/main.rs"
