name: Audit historical Libretro fork

on:
  push:
    branches: [main]
    paths:
      - "tools/audit_historic_libretro.py"
      - "tools/test_audit_historic_libretro.py"
      - "tools/export_historic_libretro.py"
      - "tools/test_export_historic_libretro.py"
      - "tools/audit_historic_external_overlap.py"
      - "tools/test_audit_historic_external_overlap.py"
      - "tools/audit_retroarch_mirror_scout.py"
      - "tools/test_retroarch_mirror_scout.py"
      - "research/retroarch-mirror-source-gaps-v1.json"
      - "sources/external-bulk/**"
      - "sources/retro-homebrew-secrets.json"
      - "archive/retro-homebrew-secrets/**"
      - "generated/v1/reports/libretro-historical-fork-coverage.json"
      - ".github/workflows/audit-historic-libretro.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate historical metadata audit without downloading cheat bodies
        run: |
          python3 tools/test_audit_historic_libretro.py
          python3 tools/test_export_historic_libretro.py
          python3 tools/test_audit_historic_external_overlap.py
          python3 tools/test_retroarch_mirror_scout.py
          python3 tools/audit_retroarch_mirror_scout.py --offline-check
          python3 tools/audit_historic_libretro.py --offline-check
      - name: Verify original pinned Git tree metadata and export link-only gaps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/audit_historic_libretro.py --check
          python3 tools/export_historic_libretro.py --output historic-libretro-candidates.json
          # Regenerate external/archive overlap in the isolated checkout.
          # The main index's pinned snapshot may not yet reflect a new source.
          python3 tools/audit_external_archive_overlap.py --write
          python3 tools/audit_historic_external_overlap.py --output historic-vs-external-blobs.json
          python3 tools/audit_retroarch_mirror_scout.py --verify-upstream --output retroarch-mirror-gaps.json
      - name: Publish historical link-only reference inventory
        uses: actions/upload-artifact@v4
        with:
          name: historic-libretro-unarchived-metadata
          path: |
            historic-libretro-candidates.json
            historic-vs-external-blobs.json
            retroarch-mirror-gaps.json
          if-no-files-found: error
          retention-days: 90
