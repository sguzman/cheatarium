name: Bootstrap console cheat archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-libretro.yml"
      - "tools/import_libretro.py"
      - "tools/validate.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cheatarium-libretro-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned NES and SNES collections
        run: python3 tools/import_libretro.py --systems nes snes
      - name: Check archive and curated references
        run: python3 tools/validate.py
      - name: Commit imported data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/libretro/cht/ sources/libretro-database.json
          if ! git diff --cached --quiet; then
            git commit -m "data: vendor pinned Libretro NES and SNES cheat archives"
            git push origin HEAD:main
          fi
