name: Bulk import pinned Libretro cheat collections

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-libretro.yml"
      - "tools/import_libretro.py"
      - "tools/validate.py"
      - "platforms/libretro-mapping.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cheatarium-libretro-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Import all mapped Libretro collections (console, handheld, arcade, computer)
        run: python3 tools/import_libretro.py --all-collections
      - name: Check archive and curated references
        run: python3 tools/validate.py
      - name: Commit imported data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/libretro/cht/ sources/libretro-database.json
          if ! git diff --cached --quiet; then
            git commit -m "data: expand pinned Libretro console cheat archives"
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              python3 tools/validate.py
              git push origin HEAD:main
            fi
          fi
