name: Bulk import pinned novel Libretro-fork cheat originals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-bithex-libretro-delta.yml"
      - "tools/import_bithex_libretro_delta.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cheatarium-bithex-delta-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Import only pinned cheat blobs absent from archived Libretro
        run: python3 tools/import_bithex_libretro_delta.py
      - name: Verify original bytes, attribution, and every existing source
        run: python3 tools/validate.py
      - name: Commit non-overlapping original cheat files and original CC BY-SA notice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/bithex-libretro-delta/ sources/bithex-libretro-delta.json
          if git diff --cached --quiet; then
            echo "Full pinned BitHeX source delta already archived."
            exit 0
          fi
          git commit -m "data(retro): preserve 1125 non-overlapping Libretro-fork cheat originals"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            python3 tools/validate.py
            git push origin HEAD:main
          fi
