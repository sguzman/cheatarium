          cargo run --locked -q -p cheatarium-client --bin cheatarium-query -- external --db generated/v1 --platform switch --title .ips --source-id ademola-switch-native --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total"] == 66 and x["external_reference_files_total"] == 38573 and all(r["kind"] == "patch" for r in x["results"])'
      - name: Confirm consumer-smoke stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh consumer-smoke
      - name: Commit reproducible index snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Builds are deterministic but older runs may finish after new
          # development commits. Do not publish obsolete generated data.
          baseline="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$baseline" != "$remote" ]]; then
            echo "Main advanced since checkout; skip stale index snapshot."
            exit 0
          fi
          git add Cargo.lock generated/v1 crates/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh provenance-aware console index snapshots"
            if ! git push origin HEAD:main; then
              remote="$(git ls-remote origin refs/heads/main | cut -f1)"
              if [[ "$baseline" != "$remote" ]]; then
                echo "Main advanced while publishing; a newer workflow will regenerate."
                exit 0
              fi
              echo "Unable to publish generated index snapshot" >&2
              exit 1
            fi
          fi

      - name: Report complete index build result on source commit
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$VALIDATION_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          payload="$(printf '{"state":"%s","context":"cheatarium/build-index","description":"Automated Cheatarium validation and distribution build"}' "$state")"
          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
