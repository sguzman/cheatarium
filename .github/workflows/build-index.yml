name: Build Cheatarium indices

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-index.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"
      - "docs/**"
      - "generated/v1/**"
      - "tools/**"
      - "crates/**"
      - "tools/build_distribution.py"
      - "tools/audit_snes_codecs.py"
      - "platforms/libretro-mapping.json"
      - "sources/libretro-database.json"
      - "sources/sharkive.json"
      - "sources/goldhen.json"
      - "sources/artemis-ps3.json"
      - "sources/admentus-enhancement-codes.json"
      - "sources/mkwcat-gecko-codes.json"
      - "sources/candidates.json"
      - "tools/validate.py"
      - "identities/**"
      - "taxonomy/**"
      - "interpretations/**"
      - "tools/validate_snes_compositions.py"
      - "tools/test_snes_compositions.py"
      - "tools/build_snes_review_queue.py"
      - "tools/test_snes_review_queue.py"
      - "tools/inspect_snes_joins.py"
      - "tools/test_inspect_snes_joins.py"
      - "tools/validate_snes_publications.py"
      - "tools/test_snes_publications.py"
      - "reviews/**"
      - "tools/validate_effect_reviews.py"
      - "tools/test_effect_reviews.py"
      - "curated/**"
      - "archive/libretro/cht/**"
      - "archive/sharkive/**"
      - "archive/goldhen/**"
      - "archive/artemis-ps3/**"
      - "archive/admentus-enhancement-codes/**"
      - "archive/mkwcat-gecko-codes/**"
  workflow_dispatch:
  workflow_run:
    workflows: ["Bootstrap console cheat archive"]
    types: [completed]

permissions:
  contents: write
  statuses: write

concurrency:
  group: cheatarium-index-build
  # Older snapshots cannot be published once main advances.
  # Stop obsolete builds instead of queueing expensive duplicate work.
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Run fast ROM-free Python regression tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for item in \
            "test_effect_reviews:test-effect-reviews" \
            "test_snes_compositions:test-snes-compositions" \
            "test_snes_review_queue:test-snes-review-queue" \
            "test_inspect_snes_joins:test-inspect-snes-joins" \
            "test_snes_publications:test-snes-publications" \
            "test_audit_snes_publication_archive:test-audit-snes-publication-archive" \
            "test_analyze_snes_patterns:test-analyze-snes-patterns"
          do
            script="${item%%:*}"
            stage="${item#*:}"
            if python3 "tools/${script}.py"; then
              bash tools/report_ci_stage.sh "$stage" success
            else
              bash tools/report_ci_stage.sh "$stage" failure
              exit 1
            fi
          done
      - name: Confirm python-tests stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh python-tests
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Verify source inventories, rights-review queue and curated references
        run: python3 tools/validate.py
      - name: Confirm source-inventory stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh source-inventory
      - name: Format Rust sources and run unit tests
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace
      - name: Build and test optional Linux desktop explorer headlessly
        run: |
          cargo check -p cheatarium-client --features desktop --bin cheatarium-explorer
          cargo test -p cheatarium-client --features desktop --bin cheatarium-explorer
      - name: Confirm desktop-tests stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh desktop-tests
      - name: Confirm rust-tests stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh rust-tests
      - name: Build per-console index bundles
        run: cargo run --locked --release -p cheatarium-index -- --root . --out generated/v1
      - name: Confirm index-generated stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh index-generated
      - name: Audit SNES interpretations and build verified distribution
        run: |
          python3 tools/validate_effect_reviews.py --write
          python3 tools/validate_effect_reviews.py --check
          python3 tools/validate_snes_compositions.py
          python3 tools/audit_snes_codecs.py --out generated/v1/reports/snes-codec-coverage.json
          python3 tools/build_snes_review_queue.py --write
          python3 tools/build_snes_review_queue.py --check
          python3 tools/analyze_snes_patterns.py --game-key push-over --limit 2 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total_pattern_families"] > 0 and 0 < d["returned"] <= 2; assert d["families_may_overlap"] and d["pattern_is_not_code_equivalence"]; assert not d["execution_or_rom_compatibility_verified"] and not d["safe_to_combine_or_auto_apply"]; assert all(f["original_occurrences"] >= 2 and f["source_git_blob_sha"] for f in d["families"])'
          python3 tools/validate_snes_publications.py --write
          python3 tools/validate_snes_publications.py --check
          python3 tools/inspect_snes_joins.py --game-key push-over --limit 2 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total_unresolved_source_occurrences"] >= 2 and d["returned"] == 2 and d["has_more"] and d["historical_publication_witnesses"] == 3; assert not d["effect_or_compatibility_verified"] and all(x["original_code"] and x["provenance"]["git_blob_sha"] for x in d["occurrences"])'
          python3 tools/inspect_snes_joins.py --game-key push-over --witnessed-only \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["witness_filter"] == "witnessed" and d["selected_source_occurrences"] == 3 and d["returned"] == 3; assert all("historical_publication_witness" in x for x in d["occurrences"])'
          python3 tools/build_distribution.py --write
          python3 tools/build_distribution.py --check
      - name: Confirm distribution-audited stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh distribution-audited
      - name: Smoke-test exported catalog
        run: |
          python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path
          root = Path("generated/v1")
          catalog = json.loads((root / "catalog.json").read_text())
          queue = json.loads((root / "reports/snes-composition-review-queue.json").read_text())
          publications = json.loads(Path("interpretations/v1/snes-published-groups.json").read_text())
          publication_count = len(publications["records"])
          manifest = json.loads((root / "distribution.json").read_text())
          assert manifest["historical_snes_publication_witnesses"] == publication_count
          assert manifest["historical_snes_source_blobs_audited"] == len({r["source_record_id"] for r in publications["records"]})
          assert manifest["historical_snes_source_ordinals_audited"] == publication_count
          assert manifest["reviewed_snes_source_ordinals_audited"] == manifest["reviewed_snes_revision_alternatives"]
          assert manifest["reviewed_snes_source_blobs_audited"] >= 1
          assert manifest["unresolved_snes_without_publication_witness"] == manifest["unresolved_snes_plus_groups"] - publication_count
          witness = next(x for x in manifest["files"] if x["path"] == "interpretations/snes-published-groups.json")
          assert witness["size_bytes"] > 0 and len(witness["sha256"]) == 64
          assert queue["schema_version"] == 1 and queue["platform"] == "snes"
          assert queue["total_unresolved_source_occurrences"] > 0
          assert queue["total_historical_publication_witnesses"] == publication_count
          assert queue["total_without_publication_witness"] == queue["total_unresolved_source_occurrences"] - publication_count
          assert all(b["unresolved_source_occurrences"] == b["historical_publication_witnesses"] + b["occurrences_without_publication_witness"] for b in queue["top_groups"])
          assert len(queue["top_groups"]) <= 100
          assert not queue["effect_or_compatibility_verified"]
          assert all(b["unresolved_source_occurrences"] > 0 for b in queue["top_groups"])
          assert catalog["schema_version"] == 1
          assert catalog["bundles"]
          for entry in catalog["bundles"]:
              assert entry["tag_index_artifact"] == f'tags/{entry["platform"]}.json.gz'
              with gzip.open(root / entry["tag_index_artifact"], "rt") as handle:
                  tags = json.load(handle)
              assert tags["platform"] == entry["platform"]
              assert sum(len(x["matches"]) for x in tags["categories"]) == entry["tag_matches"]
              assert entry["repeat_index_artifact"] == f'repeats/{entry["platform"]}.json.gz'
              with gzip.open(root / entry["repeat_index_artifact"], "rt") as handle:
                  repeat_index = json.load(handle)
              assert repeat_index["platform"] == entry["platform"]
              assert len(repeat_index["groups"]) == entry["repeat_groups"]
              with gzip.open(root / entry["artifact"], "rt") as handle:
                  bundle = json.load(handle)
              assert bundle["schema_version"] == 1
              assert bundle["platform"] == entry["platform"]
              assert len(bundle["records"]) == entry["source_files"]
              assert all("provenance" in record for record in bundle["records"])
          print("OK:", len(catalog["bundles"]), "versioned provenance-aware bundles")
          PY
      - name: Confirm consumer-catalog stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh consumer-catalog
      - name: Check real-world formats and search client
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'status=$?; bash tools/report_ci_stage.sh "cli-line-${LINENO}" failure || true; exit "$status"' ERR
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          root = Path('generated/v1')
          def load(platform):
              with gzip.open(root / f'{platform}.json.gz', 'rt') as f:
                  return json.load(f)['records']
          assert any(r['candidate_game_key'] == 'donkey-kong-country' and any(c.get('code') == '1DCC-CA7A' for c in r['codes']) for r in load('snes'))
          assert sum(c['role'] == 'memory-entry' for r in load('colecovision') for c in r['codes']) >= 100
          assert any(c['role'] == 'section-heading' for r in load('nds') for c in r['codes'])
          snes = load('snes')
          expected = {
              'DDB4-6F07': ('009E25', '00'),
              'D6B4-6F07': ('009E25', '08'),
              'C222-D4DD': ('00D0D8', 'AD'),
              '7E1E6B14': ('7E1E6B', '14'),
          }
          found = {}
          for item in snes:
              for c in item['codes']:
                  code = c.get('code')
                  if code in expected and c.get('snes_decode'):
                      writes = c['snes_decode']['writes']
                      if len(writes) == 1:
                          found[code] = (writes[0]['address_hex'], writes[0]['value_hex'])
          assert all(found.get(k) == v for k, v in expected.items()), (expected, found)
          # Placeholder codes are deliberately not converted into concrete writes.
          assert any(c.get('code') == '7FC136XX' and not c.get('snes_decode') for item in snes for c in item['codes'])
          print('OK: SNES Game Genie/PAR vectors and rejected placeholders')
          print('OK: SNES device codes, ColecoVision memory records, and NDS headings')
          PY
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- verify \
            --db generated/v1 --platform snes --json \
            | python3 -c 'import json,sys; q=json.load(sys.stdin); assert q["artifact_checksums_match"] and not q["manifest_authenticated"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- compositions \
            --db generated/v1 --platform snes --game-key donkey-kong-country --relation revision-alternatives --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schema"] == "cheatarium.source_compositions.v1" and x["total_groups"] == 27 and x["evidenced_revision_alternatives"] == 27 and not x["rom_match_verified"] and not x["safe_to_combine_or_auto_apply"]; assert all(e["composition"]["relation"] == "revision-alternatives" and len(e["composition"]["alternatives"]) == 2 and e["decoded_combined_writes"] is None for e in x["entries"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- compositions \
            --db generated/v1 --platform snes --source-record-id 'libretro-database:cht/Nintendo - Super Nintendo Entertainment System/Push-Over (USA).cht' --relation unresolved --offset 5 --limit 2 --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total_groups"] > 7 and x["offset"] == 5 and x["returned"] == 2 and x["has_more"] and len(x["entries"]) == 2'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- compositions \
            --db generated/v1 --platform snes --source-record-id 'libretro-database:cht/Nintendo - Super Nintendo Entertainment System/Push-Over (USA).cht' --relation unresolved --limit 3 --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total_groups"] > 3 and len(x["entries"]) == 3 and x["source_record_id_filter"].endswith("Push-Over (USA).cht"); assert all(e["source_record_id"] == x["source_record_id_filter"] and e["composition"]["relation"] == "unresolved" for e in x["entries"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- compositions \
            --db generated/v1 --platform snes --game-key donkey-kong-country --relation unresolved --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["evidenced_revision_alternatives"] == 0 and all(e["composition"]["relation"] == "unresolved" and not e["composition"]["evidence"] for e in x["entries"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- publications \
            --db generated/v1 --platform snes --game-key push-over --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schema"] == "cheatarium.snes_publications.v1" and x["total_witnesses"] == 3; assert x["historical_publication_only"] and not x["execution_observed"] and not x["rom_match_verified"] and not x["safe_to_auto_apply"]; assert all(c["candidate_game_key"] == "push-over" and not c["safe_to_auto_apply"] for c in x["publications"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- publications \
            --db generated/v1 --platform snes --game-key faceball-2000 --offset 1 --limit 1 --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total_witnesses"] == 3 and x["offset"] == 1 and x["returned"] == 1 and x["has_more"] and len(x["publications"]) == 1'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- publications \
            --db generated/v1 --platform snes --game-key faceball-2000 --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total_witnesses"] == 3 and len(x["publications"]) == 3; assert all(c["source_git_blob_sha"] and len(c["published_text_segments"]) > 1 for c in x["publications"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- reviews \
            --db generated/v1 --platform snes --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schema"] == "cheatarium.effect_reviews.v1" and x["total_claims"] == 3 and x["reviews_are_evidence_not_execution_permission"] and not x["unverified_imports_promoted"] and not x["cheats_activated"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- reviews \
            --db generated/v1 --platform nes --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total_claims"] == 2 and all(c["assessment"] == "reported" and c["test_context"] is None for c in x["claims"]); assert {c["source_ordinal"] for c in x["claims"]} == {0, 2}'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- reviews \
            --db generated/v1 --platform snes --category invulnerability --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total_claims"] == 1 and x["claims"][0]["source_ordinal"] == 0 and x["claims"][0]["assessment"] == "reported"'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- reviews \
            --db generated/v1 --platform snes --source-record-id 'libretro-database:cht/Nintendo - Super Nintendo Entertainment System/Donkey Kong Country (USA) (Game Genie).cht' --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total_claims"] == 3 and {c["source_ordinal"] for c in x["claims"]} == {0, 1, 8} and all(c["assessment"] == "reported" and c["test_context"] is None for c in x["claims"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- tags \
            --db generated/v1 --platform snes --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schema"] == "cheatarium.lexical_tag_categories.v1" and not x["verified_effect"] and sum(c["matches"] for c in x["categories"]) > 0'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- tags \
            --db generated/v1 --platform snes --category lives --limit 2 --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schema"] == "cheatarium.lexical_tags.v1" and x["total_matches"] > 0 and not x["verified_effect"] and not x["cheats_activated"] and all(h["matched_phrase"] for h in x["hits"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- discover \
            --db generated/v1 --title 'Donkey Kong Country' --limit 100 --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schema"] == "cheatarium.cross_platform_game_candidates.v1" and d["query"] == "Donkey Kong Country" and d["indexed_platforms"] == 43 and d["total_candidate_groups"] >= 1 and d["returned"] >= 1; assert any(h["platform"] == "snes" and h["candidate"]["key"] == "donkey-kong-country" for h in d["matches"]); assert all(h["platform"] and h["candidate"]["source_record_ids"] for h in d["matches"]); assert d["candidate_titles_only"] and not d["rom_compatibility_verified"] and d["artifact_checksums_verified"] and not d["manifest_authenticated"] and not d["cheats_activated"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- discover \
            --db generated/v1 --title 'Mario' --limit 2 --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["indexed_platforms"] == 43 and d["total_candidate_groups"] > 2 and d["returned"] == 2 and d["has_more"]; assert [(h["platform"],h["candidate"]["key"]) for h in d["matches"]] == sorted((h["platform"],h["candidate"]["key"]) for h in d["matches"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- discover \
            --db generated/v1 --title 'Donkey Kong Country' --offset 999999 --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total_candidate_groups"] > 0 and d["returned"] == 0 and d["matches"] == [] and not d["has_more"]'
          if cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- discover \
            --db generated/v1 --title 'Donkey Kong Country' --platform snes; then
            echo "ERROR: accepted per-platform option in cross-platform game discovery" >&2
            exit 1
          fi
          if cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- discover \
            --db generated/v1 --title '   '; then
            echo "ERROR: accepted blank cross-platform title search" >&2
            exit 1
          fi
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- game \
            --db generated/v1 --platform 3ds --game-key title-id-0004000000030c00 --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["platform"] == "3ds" and not d["game_identity_verified"] and not d["cheats_activated"]; assert any(s["provenance"]["source_id"] == "sharkive" and s["provenance"]["upstream_path"] == "3ds/0004000000030C00.txt" and s["declared_format_hint"] == "gateshark" for s in d["sources"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- entries \
            --db generated/v1 --platform 3ds --game-key title-id-0004000000030c00 --source-id sharkive --limit 5 --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schema"] == "cheatarium.game_entries.v1" and d["total_original_entries"] >= 1; assert d["entries"][0]["entry"]["code"] and "DD000000" in d["entries"][0]["entry"]["code"] and d["entries"][0]["entry"]["verification"] == "unverified" and not d["cheats_activated"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- game \
            --db generated/v1 --platform switch --game-key title-id-0100000000010000-build-b424be150a8e7d78 --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["platform"] == "switch" and d["total_original_sources"] == 1 and d["sources"][0]["provenance"]["upstream_path"] == "switch/0100000000010000/b424be150a8e7d78.txt" and d["sources"][0]["declared_format_hint"] == "atmosphere" and not d["game_identity_verified"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- entries \
            --db generated/v1 --platform switch --game-key title-id-0100000000010000-build-b424be150a8e7d78 --limit 4 --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total_original_entries"] >= 4 and "5C3BE7DC" in d["entries"][0]["entry"]["code"] and not d["game_identity_verified"] and not d["cheats_activated"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- game \
            --db generated/v1 --platform ps3 --game-key 'artemis-ps3:docs/codes/007 Legends BLES01614 v01.00 av01.01.ncl' --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["platform"]=="ps3" and d["total_original_sources"]==1; assert d["sources"][0]["provenance"]["source_id"]=="artemis-ps3" and d["sources"][0]["declared_format_hint"]=="artemis-ncl" and not d["game_identity_verified"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- entries \
            --db generated/v1 --platform ps3 --game-key 'artemis-ps3:docs/codes/007 Legends BLES01614 v01.00 av01.01.ncl' --limit 2 --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total_original_entries"]>=2 and d["entries"][0]["entry"]["description"]=="No Damage From Enemy Bullets Or Melee" and "DANNY G" in str(d["entries"][0]["entry"]["native_fields"]) and not d["cheats_activated"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- entries \
            --db generated/v1 --platform ps4 --game-key 'goldhen:json/CUSA00002_01.00.json' --limit 3 --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total_original_entries"]==3 and d["entries"][0]["entry"]["description"]=="Godmode" and "668DA3" in d["entries"][0]["entry"]["code"] and "Talixme" in str(d["entries"][0]["entry"]["native_fields"]) and not d["cheats_activated"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- entries \
            --db generated/v1 --platform ps4 --game-key 'goldhen:mc4/CUSA00002_01.00.mc4' --json \
