          assert out["total_header_bytes_read"] == out["game_file_bytes_read"]
          assert out["inspected_nsp_file_bytes_read"] == sum(f["header_bytes_read"] for f in out["files"] if f["file_type"] == "nsp")
          assert out["total_header_bytes_read"] < 1024
          assert len(out["advisory_nsp_title_associations"]) == 1
          hint = out["advisory_nsp_title_associations"][0]
          assert hint["file_path"].endswith("Game With No Title Label.nsp")
          assert hint["title_id_hint"] == "0100000000010000"
          assert not hint["installed_game_verified"]
