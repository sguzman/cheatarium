name: Build Cheatarium indices

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-index.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "tools/build_distribution.py"
      - "platforms/libretro-mapping.json"
      - "sources/libretro-database.json"
      - "archive/libretro/cht/**"
  workflow_dispatch:
  workflow_run:
    workflows: ["Bootstrap console cheat archive"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: cheatarium-index-build
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Format Rust sources and run unit tests
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace
      - name: Build per-console index bundles
        run: cargo run --locked --release -p cheatarium-index -- --root . --out generated/v1
      - name: Build SHA-256 distribution and validate cross-index links
        run: |
          python3 tools/build_distribution.py --write
          python3 tools/build_distribution.py --check
      - name: Smoke-test exported catalog
        run: |
          python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path
          root = Path("generated/v1")
          catalog = json.loads((root / "catalog.json").read_text())
          assert catalog["schema_version"] == 1
          assert catalog["bundles"]
          for entry in catalog["bundles"]:
              with gzip.open(root / entry["artifact"], "rt") as handle:
                  bundle = json.load(handle)
              assert bundle["schema_version"] == 1
              assert bundle["platform"] == entry["platform"]
              assert len(bundle["records"]) == entry["source_files"]
              assert all("provenance" in record for record in bundle["records"])
          print("OK:", len(catalog["bundles"]), "versioned provenance-aware bundles")
          PY
      - name: Check real-world formats and search client
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          root = Path('generated/v1')
          def load(platform):
              with gzip.open(root / f'{platform}.json.gz', 'rt') as f:
                  return json.load(f)['records']
          assert any(r['candidate_game_key'] == 'donkey-kong-country' and any(c.get('code') == '1DCC-CA7A' for c in r['codes']) for r in load('snes'))
          assert sum(c['role'] == 'memory-entry' for r in load('colecovision') for c in r['codes']) >= 100
          assert any(c['role'] == 'section-heading' for r in load('nds') for c in r['codes'])
          print('OK: SNES device codes, ColecoVision memory records, and NDS headings')
          PY
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- verify \
            --db generated/v1 --platform snes --json \
            | python3 -c 'import json,sys; q=json.load(sys.stdin); assert q["artifact_checksums_match"] and not q["manifest_authenticated"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- games \
            --db generated/v1 --platform snes --title "Donkey Kong Country" --limit 2 --json \
            | python3 -c 'import json,sys; q=json.load(sys.stdin); assert q["total_candidate_groups"] > 0 and q["candidate_only"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- search \
            --db generated/v1 --platform snes --title 'Donkey Kong Country' --limit 2 --json \
            | python3 -c 'import json,sys; q=json.load(sys.stdin); assert q["total_source_records"] > 0 and q["candidate_only"]'
      - name: Commit reproducible index snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock generated/v1 crates/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh provenance-aware console index snapshots"
            git push origin HEAD:main
          fi
