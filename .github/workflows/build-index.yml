name: Build Cheatarium indices

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-index.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"
      - "docs/**"
      - "generated/v1/**"
      - "tools/**"
      - "crates/**"
      - "tools/build_distribution.py"
      - "tools/audit_snes_codecs.py"
      - "platforms/libretro-mapping.json"
      - "sources/libretro-database.json"
      - "sources/candidates.json"
      - "tools/validate.py"
      - "identities/**"
      - "taxonomy/**"
      - "interpretations/**"
      - "tools/validate_snes_compositions.py"
      - "tools/test_snes_compositions.py"
      - "tools/build_snes_review_queue.py"
      - "tools/test_snes_review_queue.py"
      - "tools/inspect_snes_joins.py"
      - "tools/test_inspect_snes_joins.py"
      - "tools/validate_snes_publications.py"
      - "tools/test_snes_publications.py"
      - "reviews/**"
      - "tools/validate_effect_reviews.py"
      - "tools/test_effect_reviews.py"
      - "curated/**"
      - "archive/libretro/cht/**"
  workflow_dispatch:
  workflow_run:
    workflows: ["Bootstrap console cheat archive"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: cheatarium-index-build
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify source inventories, rights-review queue and curated references
        run: python3 tools/validate.py
      - name: Format Rust sources and run unit tests
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace
      - name: Build per-console index bundles
        run: cargo run --locked --release -p cheatarium-index -- --root . --out generated/v1
      - name: Audit SNES interpretations and build verified distribution
        run: |
          python3 tools/test_effect_reviews.py
          python3 tools/validate_effect_reviews.py --write
          python3 tools/validate_effect_reviews.py --check
          python3 tools/test_snes_compositions.py
          python3 tools/validate_snes_compositions.py
          python3 tools/audit_snes_codecs.py --out generated/v1/reports/snes-codec-coverage.json
          python3 tools/test_snes_review_queue.py
          python3 tools/build_snes_review_queue.py --write
          python3 tools/build_snes_review_queue.py --check
          python3 tools/test_inspect_snes_joins.py
          python3 tools/test_snes_publications.py
          python3 tools/validate_snes_publications.py --write
          python3 tools/validate_snes_publications.py --check
          python3 tools/inspect_snes_joins.py --game-key push-over --limit 2 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total_unresolved_source_occurrences"] >= 2 and d["returned"] == 2 and d["has_more"] and d["historical_publication_witnesses"] == 3; assert not d["effect_or_compatibility_verified"] and all(x["original_code"] and x["provenance"]["git_blob_sha"] for x in d["occurrences"])'
          python3 tools/inspect_snes_joins.py --game-key push-over --witnessed-only \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["witness_filter"] == "witnessed" and d["selected_source_occurrences"] == 3 and d["returned"] == 3; assert all("historical_publication_witness" in x for x in d["occurrences"])'
          python3 tools/build_distribution.py --write
          python3 tools/build_distribution.py --check
      - name: Smoke-test exported catalog
        run: |
          python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path
          root = Path("generated/v1")
          catalog = json.loads((root / "catalog.json").read_text())
          queue = json.loads((root / "reports/snes-composition-review-queue.json").read_text())
          publications = json.loads(Path("interpretations/v1/snes-published-groups.json").read_text())
          publication_count = len(publications["records"])
          manifest = json.loads((root / "distribution.json").read_text())
          assert manifest["historical_snes_publication_witnesses"] == publication_count
          assert manifest["unresolved_snes_without_publication_witness"] == manifest["unresolved_snes_plus_groups"] - publication_count
          witness = next(x for x in manifest["files"] if x["path"] == "interpretations/snes-published-groups.json")
          assert witness["size_bytes"] > 0 and len(witness["sha256"]) == 64
          assert queue["schema_version"] == 1 and queue["platform"] == "snes"
          assert queue["total_unresolved_source_occurrences"] > 0
          assert queue["total_historical_publication_witnesses"] == publication_count
          assert queue["total_without_publication_witness"] == queue["total_unresolved_source_occurrences"] - publication_count
          assert all(b["unresolved_source_occurrences"] == b["historical_publication_witnesses"] + b["occurrences_without_publication_witness"] for b in queue["top_groups"])
          assert len(queue["top_groups"]) <= 100
          assert not queue["effect_or_compatibility_verified"]
          assert all(b["unresolved_source_occurrences"] > 0 for b in queue["top_groups"])
          assert catalog["schema_version"] == 1
          assert catalog["bundles"]
          for entry in catalog["bundles"]:
              assert entry["tag_index_artifact"] == f'tags/{entry["platform"]}.json.gz'
              with gzip.open(root / entry["tag_index_artifact"], "rt") as handle:
                  tags = json.load(handle)
              assert tags["platform"] == entry["platform"]
              assert sum(len(x["matches"]) for x in tags["categories"]) == entry["tag_matches"]
              assert entry["repeat_index_artifact"] == f'repeats/{entry["platform"]}.json.gz'
              with gzip.open(root / entry["repeat_index_artifact"], "rt") as handle:
                  repeat_index = json.load(handle)
              assert repeat_index["platform"] == entry["platform"]
              assert len(repeat_index["groups"]) == entry["repeat_groups"]
              with gzip.open(root / entry["artifact"], "rt") as handle:
                  bundle = json.load(handle)
              assert bundle["schema_version"] == 1
              assert bundle["platform"] == entry["platform"]
              assert len(bundle["records"]) == entry["source_files"]
              assert all("provenance" in record for record in bundle["records"])
          print("OK:", len(catalog["bundles"]), "versioned provenance-aware bundles")
          PY
      - name: Check real-world formats and search client
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          root = Path('generated/v1')
          def load(platform):
              with gzip.open(root / f'{platform}.json.gz', 'rt') as f:
                  return json.load(f)['records']
          assert any(r['candidate_game_key'] == 'donkey-kong-country' and any(c.get('code') == '1DCC-CA7A' for c in r['codes']) for r in load('snes'))
          assert sum(c['role'] == 'memory-entry' for r in load('colecovision') for c in r['codes']) >= 100
          assert any(c['role'] == 'section-heading' for r in load('nds') for c in r['codes'])
          snes = load('snes')
          expected = {
              'DDB4-6F07': ('009E25', '00'),
              'D6B4-6F07': ('009E25', '08'),
              'C222-D4DD': ('00D0D8', 'AD'),
              '7E1E6B14': ('7E1E6B', '14'),
          }
          found = {}
          for item in snes:
              for c in item['codes']:
                  code = c.get('code')
                  if code in expected and c.get('snes_decode'):
                      writes = c['snes_decode']['writes']
                      if len(writes) == 1:
                          found[code] = (writes[0]['address_hex'], writes[0]['value_hex'])
          assert all(found.get(k) == v for k, v in expected.items()), (expected, found)
          # Placeholder codes are deliberately not converted into concrete writes.
          assert any(c.get('code') == '7FC136XX' and not c.get('snes_decode') for item in snes for c in item['codes'])
          print('OK: SNES Game Genie/PAR vectors and rejected placeholders')
          print('OK: SNES device codes, ColecoVision memory records, and NDS headings')
          PY
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- verify \
            --db generated/v1 --platform snes --json \
            | python3 -c 'import json,sys; q=json.load(sys.stdin); assert q["artifact_checksums_match"] and not q["manifest_authenticated"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- compositions \
            --db generated/v1 --platform snes --game-key donkey-kong-country --relation revision-alternatives --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schema"] == "cheatarium.source_compositions.v1" and x["total_groups"] == 27 and x["evidenced_revision_alternatives"] == 27 and not x["rom_match_verified"] and not x["safe_to_combine_or_auto_apply"]; assert all(e["composition"]["relation"] == "revision-alternatives" and len(e["composition"]["alternatives"]) == 2 and e["decoded_combined_writes"] is None for e in x["entries"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- compositions \
            --db generated/v1 --platform snes --game-key donkey-kong-country --relation unresolved --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["evidenced_revision_alternatives"] == 0 and all(e["composition"]["relation"] == "unresolved" and not e["composition"]["evidence"] for e in x["entries"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- reviews \
            --db generated/v1 --platform snes --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schema"] == "cheatarium.effect_reviews.v1" and x["total_claims"] == 3 and x["reviews_are_evidence_not_execution_permission"] and not x["unverified_imports_promoted"] and not x["cheats_activated"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- reviews \
            --db generated/v1 --platform nes --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total_claims"] == 2 and all(c["assessment"] == "reported" and c["test_context"] is None for c in x["claims"]); assert {c["source_ordinal"] for c in x["claims"]} == {0, 2}'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- reviews \
            --db generated/v1 --platform snes --category invulnerability --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total_claims"] == 1 and x["claims"][0]["source_ordinal"] == 0 and x["claims"][0]["assessment"] == "reported"'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- reviews \
            --db generated/v1 --platform snes --source-record-id 'libretro-database:cht/Nintendo - Super Nintendo Entertainment System/Donkey Kong Country (USA) (Game Genie).cht' --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total_claims"] == 3 and {c["source_ordinal"] for c in x["claims"]} == {0, 1, 8} and all(c["assessment"] == "reported" and c["test_context"] is None for c in x["claims"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- tags \
            --db generated/v1 --platform snes --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schema"] == "cheatarium.lexical_tag_categories.v1" and not x["verified_effect"] and sum(c["matches"] for c in x["categories"]) > 0'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- tags \
            --db generated/v1 --platform snes --category lives --limit 2 --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schema"] == "cheatarium.lexical_tags.v1" and x["total_matches"] > 0 and not x["verified_effect"] and not x["cheats_activated"] and all(h["matched_phrase"] for h in x["hits"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- effects \
            --db generated/v1 --platform snes --effect "Infinite" --limit 2 --json \
            | python3 -c 'import json,sys; q=json.load(sys.stdin); assert q["schema"] == "cheatarium.effects.v1" and q["total_matches"] > 0 and not q["cheats_activated"]; assert all(hit["provenance"]["git_blob_sha"] for hit in q["hits"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- effects \
            --db generated/v1 --platform snes --effect "Infinite" --declared-format game-genie --source-id libretro-database --limit 3 --json \
            | python3 -c 'import json,sys; q=json.load(sys.stdin); assert q["total_matches"] > 0 and q["declared_format_filter"] == "game-genie" and q["source_id_filter"] == "libretro-database"; assert all(h["format_hint"] == "game-genie" and h["provenance"]["source_id"] == "libretro-database" for h in q["hits"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- repeats \
            --db generated/v1 --platform snes --game-key donkey-kong-country --limit 2 --json \
            | python3 -c 'import json,sys; q=json.load(sys.stdin); assert q["schema"] == "cheatarium.raw_repeats.v1" and q["candidate_only"] and not q["equivalent_effect_verified"] and not q["rom_compatibility_verified"] and not q["cheats_activated"]; assert all(len(g["occurrences"]) >= 2 and not g["confirmed_equivalent_cheat"] for g in q["groups"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- repeats \
            --db generated/v1 --platform snes --game-key donkey-kong-country --varying-descriptions --json \
            | python3 -c 'import json,sys; q=json.load(sys.stdin); assert q["varying_descriptions_only"]; assert all(g["description_text_varies"] and g["description_variants"] > 1 for g in q["groups"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- games \
            --db generated/v1 --platform snes --title "Donkey Kong Country" --limit 2 --json \
            | python3 -c 'import json,sys; q=json.load(sys.stdin); assert q["total_candidate_groups"] > 0 and q["candidate_only"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- search \
            --db generated/v1 --platform snes --title 'Donkey Kong Country' --limit 2 --json \
            | python3 -c 'import json,sys; q=json.load(sys.stdin); assert q["total_source_records"] > 0 and q["candidate_only"]'
      - name: Verify read-only ROM SHA-256 fingerprint behavior
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp)"
          trap 'rm -f "$fixture"' EXIT
          printf abc > "$fixture"
          cargo run --locked --release -p cheatarium-client --bin cheatarium-fingerprint -- --platform snes --file "$fixture" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["fingerprint"]["sha256"] == "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"; assert d["fingerprint"]["byte_length"] == 3; assert d["evidence_lookup"]["status"] == "no_evidence"; assert not d["evidence_lookup"]["cheat_compatibility_verified"] and not d["filename_matching_used"] and not d["cheats_activated"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- verify --db generated/v1 --platform snes --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["artifact_checksums_match"] and not d["cheats_verified"]'
      - name: Smoke-test local SNES ZIP inventory (synthetic bytes only)
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/zips/subdir"
          python3 - "$work/zips/subdir/Synthetic.zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1], "w", compression=zipfile.ZIP_DEFLATED) as z:
              z.writestr("fixture.SFC", b"abc")
              z.writestr("ignore.txt", b"not a ROM")
          PY
          cargo run --locked --release -p cheatarium-client --bin cheatarium-inventory -- \
            --rom-dir "$work/zips" --out "$work/private-inventory.json"
          python3 - "$work/private-inventory.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["archives_scanned"]==1 and d["rom_members_hashed"]==1 and not d["issues"]
          r=d["entries"][0]
          assert r["archive"]=="subdir/Synthetic.zip" and r["member"]=="fixture.SFC"
          assert r["sha256"]=="ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
          assert r["byte_length"]==3 and not r["possible_512_byte_copier_header_by_length_only"]
          assert d["identity_status"].startswith("fingerprints_only")
          PY
          if cargo run --locked --release -p cheatarium-client --bin cheatarium-inventory -- \
            --rom-dir "$work/zips" --out "$work/private-inventory.json"; then
            echo "ERROR: scanner unexpectedly overwrote private inventory" >&2
            exit 1
          fi
      - name: Exercise standalone codec and audit entire SNES coverage
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release -p cheatarium-codecs --bin cheatarium-decode -- decode snes game-genie DDB4-6F07 \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["decoded"]["writes"][0] == {"address_hex":"009E25","value_hex":"00"}; assert not x["executable"] and not x["rom_compatible"]'
          cargo run --locked --release -p cheatarium-codecs --bin cheatarium-decode -- decode snes syntax 7E1E6B14 \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); d=x["decoded"]; assert d["interpretation_basis"] == "code-syntax" and d["format"] == "raw-snes-address-value" and not x["executable"]'
          cargo run --locked --release -p cheatarium-codecs --bin cheatarium-decode -- decode snes syntax DDB4-6F07 \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["decoded"]["format"] == "game-genie" and x["decoded"]["interpretation_basis"] == "code-syntax"'
          if cargo run --locked --release -p cheatarium-codecs --bin cheatarium-decode -- decode snes action-replay 7FC136XX; then
            echo "ERROR: placeholder cheat unexpectedly decoded" >&2
            exit 1
          fi
          python3 tools/audit_snes_codecs.py --json | python3 -c 'import json,sys; a=json.load(sys.stdin); c=a["counts"]; assert c["strictly_decoded"] > 10000 and c["decoded_from_code_syntax"] > 0 and c["format_not_identified"] > 0'
      - name: Commit reproducible index snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Builds are deterministic but older runs may finish after new
          # development commits. Do not publish obsolete generated data.
          baseline="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$baseline" != "$remote" ]]; then
            echo "Main advanced since checkout; skip stale index snapshot."
            exit 0
          fi
          git add Cargo.lock generated/v1 crates/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh provenance-aware console index snapshots"
            if ! git push origin HEAD:main; then
              remote="$(git ls-remote origin refs/heads/main | cut -f1)"
              if [[ "$baseline" != "$remote" ]]; then
                echo "Main advanced while publishing; a newer workflow will regenerate."
                exit 0
              fi
              echo "Unable to publish generated index snapshot" >&2
              exit 1
            fi
          fi
