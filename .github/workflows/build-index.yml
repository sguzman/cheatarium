  workflow_dispatch:
  workflow_run:
    workflows: ["Bulk import pinned Libretro cheat collections", "Bulk import pinned PS5 native cheat sources", "Bulk import pinned PS Vita cheat sources", "Bulk import pinned PS2 CheatDevice database", "Bulk import pinned PS2 ZIP cheat collections", "Bulk import pinned PS2 PNACH conversion library", "Bulk import pinned Nintendo Switch NXCheats collection", "Bulk import pinned converted PS3 Artemis-derived collection", "Bulk import pinned novel Libretro-fork cheat originals"]
    types: [completed]

permissions:
  contents: write
  statuses: write

concurrency:
  group: cheatarium-index-build
  # Older snapshots cannot be published once main advances.
  # Stop obsolete builds instead of queueing expensive duplicate work.
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Run fast ROM-free Python regression tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for item in \
            "test_effect_reviews:test-effect-reviews" \
            "test_snes_compositions:test-snes-compositions" \
            "test_snes_review_queue:test-snes-review-queue" \
            "test_inspect_snes_joins:test-inspect-snes-joins" \
            "test_snes_publications:test-snes-publications" \
            "test_audit_snes_publication_archive:test-audit-snes-publication-archive" \
            "test_analyze_snes_patterns:test-analyze-snes-patterns" \
            "test_measure_switch_bulk_coverage:test-measure-switch-bulk-coverage"
          do
            script="${item%%:*}"
            stage="${item#*:}"
            if python3 "tools/${script}.py"; then
              bash tools/report_ci_stage.sh "$stage" success
            else
              bash tools/report_ci_stage.sh "$stage" failure
              exit 1
            fi
          done
          python3 tools/test_external_bulk.py
          python3 tools/test_build_external_distribution.py
          python3 tools/test_external_overlap.py
          python3 tools/test_external_archive_overlap.py
          python3 tools/test_ps2_external_crc_labels.py
          python3 tools/test_import_mohasi_ps3.py
          python3 tools/test_import_bithex_libretro_delta.py
      - name: Confirm python-tests stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh python-tests
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Verify source inventories, rights-review queue and curated references
        run: python3 tools/validate.py
      - name: Confirm source-inventory stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh source-inventory
      - name: Format Rust sources and run unit tests
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace
      - name: Build and test optional Linux desktop explorer headlessly
        run: |
          cargo check -p cheatarium-client --features desktop --bin cheatarium-explorer
          cargo test -p cheatarium-client --features desktop --bin cheatarium-explorer
      - name: Confirm desktop-tests stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh desktop-tests
      - name: Confirm rust-tests stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh rust-tests
      - name: Build per-console index bundles
        run: cargo run --locked --release -p cheatarium-index -- --root . --out generated/v1
      - name: Measure bulk PS2 title-label coverage and source overlap
        run: |
          python3 tools/measure_ps2_bulk_coverage.py --write
          python3 tools/measure_ps2_bulk_coverage.py --check
          python3 tools/measure_switch_bulk_coverage.py --write
          python3 tools/measure_switch_bulk_coverage.py --check
          python3 tools/external_bulk.py --check
          python3 tools/build_external_distribution.py --write
          python3 tools/build_external_distribution.py --check
          python3 tools/audit_external_overlap.py --write
          python3 tools/audit_external_overlap.py --check
          python3 tools/audit_external_archive_overlap.py --write
          python3 tools/audit_external_archive_overlap.py --check
          python3 tools/audit_ps2_external_crc_labels.py --write
          python3 tools/audit_ps2_external_crc_labels.py --check
      - name: Confirm index-generated stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh index-generated
      - name: Audit SNES interpretations and build verified distribution
        run: |
          python3 tools/validate_effect_reviews.py --write
          python3 tools/validate_effect_reviews.py --check
          python3 tools/validate_snes_compositions.py
          python3 tools/audit_snes_codecs.py --out generated/v1/reports/snes-codec-coverage.json
          python3 tools/build_snes_review_queue.py --write
          python3 tools/build_snes_review_queue.py --check
          python3 tools/analyze_snes_patterns.py --game-key push-over --limit 2 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total_pattern_families"] > 0 and 0 < d["returned"] <= 2; assert d["families_may_overlap"] and d["pattern_is_not_code_equivalence"]; assert not d["execution_or_rom_compatibility_verified"] and not d["safe_to_combine_or_auto_apply"]; assert all(f["original_occurrences"] >= 2 and f["source_git_blob_sha"] for f in d["families"])'
          python3 tools/validate_snes_publications.py --write
          python3 tools/validate_snes_publications.py --check
          python3 tools/inspect_snes_joins.py --game-key push-over --limit 2 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total_unresolved_source_occurrences"] >= 2 and d["returned"] == 2 and d["has_more"] and d["historical_publication_witnesses"] == 3; assert not d["effect_or_compatibility_verified"] and all(x["original_code"] and x["provenance"]["git_blob_sha"] for x in d["occurrences"])'
          python3 tools/inspect_snes_joins.py --game-key push-over --witnessed-only \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["witness_filter"] == "witnessed" and d["selected_source_occurrences"] == 3 and d["returned"] == 3; assert all("historical_publication_witness" in x for x in d["occurrences"])'
          python3 tools/build_distribution.py --write
          python3 tools/build_distribution.py --check
      - name: Confirm distribution-audited stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh distribution-audited
      - name: Smoke-test exported catalog
        run: |
          python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path
          root = Path("generated/v1")
          catalog = json.loads((root / "catalog.json").read_text())
          queue = json.loads((root / "reports/snes-composition-review-queue.json").read_text())
          publications = json.loads(Path("interpretations/v1/snes-published-groups.json").read_text())
          publication_count = len(publications["records"])
          manifest = json.loads((root / "distribution.json").read_text())
          assert manifest["historical_snes_publication_witnesses"] == publication_count
          assert manifest["historical_snes_source_blobs_audited"] == len({r["source_record_id"] for r in publications["records"]})
          assert manifest["historical_snes_source_ordinals_audited"] == publication_count
          assert manifest["reviewed_snes_source_ordinals_audited"] == manifest["reviewed_snes_revision_alternatives"]
          assert manifest["reviewed_snes_source_blobs_audited"] >= 1
          assert manifest["unresolved_snes_without_publication_witness"] == manifest["unresolved_snes_plus_groups"] - publication_count
          witness = next(x for x in manifest["files"] if x["path"] == "interpretations/snes-published-groups.json")
          assert witness["size_bytes"] > 0 and len(witness["sha256"]) == 64
          assert queue["schema_version"] == 1 and queue["platform"] == "snes"
          assert queue["total_unresolved_source_occurrences"] > 0
          assert queue["total_historical_publication_witnesses"] == publication_count
          assert queue["total_without_publication_witness"] == queue["total_unresolved_source_occurrences"] - publication_count
          assert all(b["unresolved_source_occurrences"] == b["historical_publication_witnesses"] + b["occurrences_without_publication_witness"] for b in queue["top_groups"])
          assert len(queue["top_groups"]) <= 100
          assert not queue["effect_or_compatibility_verified"]
          assert all(b["unresolved_source_occurrences"] > 0 for b in queue["top_groups"])
          assert catalog["schema_version"] == 1
          assert catalog["bundles"]
          for entry in catalog["bundles"]:
              assert entry["tag_index_artifact"] == f'tags/{entry["platform"]}.json.gz'
              with gzip.open(root / entry["tag_index_artifact"], "rt") as handle:
                  tags = json.load(handle)
              assert tags["platform"] == entry["platform"]
              assert sum(len(x["matches"]) for x in tags["categories"]) == entry["tag_matches"]
              assert entry["repeat_index_artifact"] == f'repeats/{entry["platform"]}.json.gz'
              with gzip.open(root / entry["repeat_index_artifact"], "rt") as handle:
                  repeat_index = json.load(handle)
              assert repeat_index["platform"] == entry["platform"]
              assert len(repeat_index["groups"]) == entry["repeat_groups"]
              with gzip.open(root / entry["artifact"], "rt") as handle:
                  bundle = json.load(handle)
              assert bundle["schema_version"] == 1
              assert bundle["platform"] == entry["platform"]
              assert len(bundle["records"]) == entry["source_files"]
              assert all("provenance" in record for record in bundle["records"])
          print("OK:", len(catalog["bundles"]), "versioned provenance-aware bundles")
          PY
      - name: Confirm consumer-catalog stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/report_ci_stage.sh consumer-catalog
      - name: Check real-world formats and search client
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'status=$?; bash tools/report_ci_stage.sh "cli-line-${LINENO}" failure || true; exit "$status"' ERR
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          root = Path('generated/v1')
          def load(platform):
              with gzip.open(root / f'{platform}.json.gz', 'rt') as f:
                  return json.load(f)['records']
          assert any(r['candidate_game_key'] == 'donkey-kong-country' and any(c.get('code') == '1DCC-CA7A' for c in r['codes']) for r in load('snes'))
          assert sum(c['role'] == 'memory-entry' for r in load('colecovision') for c in r['codes']) >= 100
          assert any(c['role'] == 'section-heading' for r in load('nds') for c in r['codes'])
          snes = load('snes')
          expected = {
              'DDB4-6F07': ('009E25', '00'),
              'D6B4-6F07': ('009E25', '08'),
              'C222-D4DD': ('00D0D8', 'AD'),
              '7E1E6B14': ('7E1E6B', '14'),
          }
          found = {}
          for item in snes:
              for c in item['codes']:
                  code = c.get('code')
                  if code in expected and c.get('snes_decode'):
                      writes = c['snes_decode']['writes']
                      if len(writes) == 1:
                          found[code] = (writes[0]['address_hex'], writes[0]['value_hex'])
          assert all(found.get(k) == v for k, v in expected.items()), (expected, found)
          # Placeholder codes are deliberately not converted into concrete writes.
          assert any(c.get('code') == '7FC136XX' and not c.get('snes_decode') for item in snes for c in item['codes'])
          print('OK: SNES Game Genie/PAR vectors and rejected placeholders')
          print('OK: SNES device codes, ColecoVision memory records, and NDS headings')
          PY
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- verify \
            --db generated/v1 --platform snes --json \
            | python3 -c 'import json,sys; q=json.load(sys.stdin); assert q["artifact_checksums_match"] and not q["manifest_authenticated"]'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- compositions \
            --db generated/v1 --platform snes --game-key donkey-kong-country --relation revision-alternatives --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["schema"] == "cheatarium.source_compositions.v1" and x["total_groups"] == 27 and x["evidenced_revision_alternatives"] == 27 and not x["rom_match_verified"] and not x["safe_to_combine_or_auto_apply"]; assert all(e["composition"]["relation"] == "revision-alternatives" and len(e["composition"]["alternatives"]) == 2 and e["decoded_combined_writes"] is None for e in x["entries"])'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- compositions \
            --db generated/v1 --platform snes --source-record-id 'libretro-database:cht/Nintendo - Super Nintendo Entertainment System/Push-Over (USA).cht' --relation unresolved --offset 5 --limit 2 --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total_groups"] > 7 and x["offset"] == 5 and x["returned"] == 2 and x["has_more"] and len(x["entries"]) == 2'
          cargo run --locked --release -p cheatarium-client --bin cheatarium-query -- compositions \
            --db generated/v1 --platform snes --source-record-id 'libretro-database:cht/Nintendo - Super Nintendo Entertainment System/Push-Over (USA).cht' --relation unresolved --limit 3 --json \
            | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["total_groups"] > 3 and len(x["entries"]) == 3 and x["source_record_id_filter"].endswith("Push-Over (USA).cht"); assert all(e["source_record_id"] == x["source_record_id_filter"] and e["composition"]["relation"] == "unresolved" for e in x["entries"])'
