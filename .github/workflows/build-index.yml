                  descriptors.extend(struct.pack("<QQII", content_at, len(content), name_at, 0))
                  payload.extend(content)
              path.write_bytes(b"PFS0" + struct.pack("<III", len(entries), len(names), 0) + descriptors + names + payload)
          nsp(nested/"Game With No Title Label.nsp", "01000000000100000000000000000000")
          nsp(nested/"Game Update [0100000000010800].nsp", "01000000000108000000000000000000")
          nsp(nested/"dlc"/"Cosmetic [0100000000011001].nsp", "01000000000110010000000000000000")
          xci = bytearray(0x220)
          xci[0x100:0x104] = b"HEAD"
          (root/"other"/"Card game.xci").write_bytes(xci)
          (root/"other"/"Compressed Game.nsz").write_bytes(b"not read")
          (root/"other"/"Standalone.nca").write_bytes(b"encrypted")
          (root/"other"/"ignore.txt").write_bytes(b"not game")
