name: Verify local Nintendo acquisition cache tool

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-nintendo-hydration.yml"
      - "tools/hydrate_nintendo_bulk.py"
      - "tools/test_hydrate_nintendo_bulk.py"
      - "research/nintendo-gamecube-wiird-member-claims-v1.json"
      - "sources/external-bulk/leumas-gamecube-wiird-zips.json"
      - "sources/external-bulk/katsumaki-wiiu-xml.json"
      - "sources/external-bulk/ucodes-wiiu-json.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Synthetic verification and cache safety regressions
        run: python3 tools/test_hydrate_nintendo_bulk.py
      - name: Verify user-owned cache CLI help (no downloads)
        run: python3 tools/hydrate_nintendo_bulk.py --help
      - name: Verify full acquisition against actual pinned upstream originals
        run: |
          python3 tools/hydrate_nintendo_bulk.py --fetch --destination "${RUNNER_TEMP}/cheatarium-nintendo-source-test"
          python3 tools/hydrate_nintendo_bulk.py --check --destination "${RUNNER_TEMP}/cheatarium-nintendo-source-test"
          python3 tools/hydrate_nintendo_bulk.py --fetch --destination "${RUNNER_TEMP}/cheatarium-nintendo-source-test"
          test "$(find "${RUNNER_TEMP}/cheatarium-nintendo-source-test/gamecube" -type f | wc -l)" -eq 375
          test "$(find "${RUNNER_TEMP}/cheatarium-nintendo-source-test/wii-u" -type f | wc -l)" -eq 13
