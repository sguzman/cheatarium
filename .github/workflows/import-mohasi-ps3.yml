name: Bulk import pinned converted PS3 Artemis-derived collection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-mohasi-ps3.yml"
      - "tools/import_mohasi_ps3.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cheatarium-ps3-mohasi-bulk-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Acquire full pinned PS3 source/compiled text collection
        run: python3 tools/import_mohasi_ps3.py
      - name: Validate all archived original source blobs
        run: python3 tools/validate.py
      - name: Commit unchanged PS3 original files and pinned provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/mohasi-ps3-compiled/ sources/mohasi-ps3-compiled.json
          if git diff --cached --quiet; then
            echo "Pinned Mohasi PS3 collection already archived."
            exit 0
          fi
          git commit -m "data(ps3): preserve 17688 original converted Artemis PS3 source files"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            python3 tools/validate.py
            git push origin HEAD:main
          fi
