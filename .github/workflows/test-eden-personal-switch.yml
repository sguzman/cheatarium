name: Verify Eden personal Switch coverage

on:
  push:
    branches:
      - main
      - "work/eden-personal-coverage-*"
    paths:
      - ".github/workflows/test-eden-personal-switch.yml"
      - "crates/cheatarium-client/src/bin/eden_discover.rs"
      - "crates/cheatarium-client/src/bin/eden_curated_readiness.rs"
      - "crates/cheatarium-client/src/bin/eden_plan.rs"
      - "crates/cheatarium-client/src/bin/eden_private.rs"
      - "crates/cheatarium-client/src/bin/eden_install.rs"
      - "crates/cheatarium-client/src/bin/eden_personal_coverage.rs"
      - "research/switch-personal-curation-v1.json"
      - "tools/curate_switch_private.py"
      - "tools/test_curate_switch_private.py"
      - "tools/fetch_smash_private.py"
      - "tools/test_fetch_smash_private.py"
      - "tools/test_curated_switch.py"
      - "tools/test_switch_exact_build_coverage.py"
      - "tools/reconcile_switch_exact_build_coverage.py"
      - "tools/save_switch_collection.py"
      - "tools/test_save_switch_collection.py"
      - "sources/switch-exact-*.json"
      - "archive/switch-exact-*/**"
      - "crates/cheatarium-client/src/curated.rs"
      - "crates/cheatarium-client/src/native_switch.rs"
      - "crates/cheatarium-client/src/main.rs"
      - "research/switch-exact-build-coverage-v1.json"
      - "curated/switch/**"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-eden-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test exact-build personal coverage against Eden discovery
        run: |
          cargo test --locked -p cheatarium-client --bin cheatarium-eden-discover
          cargo test --locked -p cheatarium-client --bin cheatarium-eden-curated-readiness
          cargo test --locked -p cheatarium-client --bin cheatarium-eden-plan
          cargo test --locked -p cheatarium-client --bin cheatarium-query
          cargo run --locked -q -p cheatarium-client --bin cheatarium-query -- curated --platform switch --title-id 0100BC0018138000 --build-id E968832CADE2AD7C --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total"] == 58 and d["code_visible"] is False and all("code" not in row for row in d["results"])'
          cargo run --locked -q -p cheatarium-client --bin cheatarium-query -- curated --coverage --only-missing --title-id 01002DA013484000 --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["matched_sections"] == 47 and d["source_only_sections"] == 47 and d["archived_sections"] == 0'
          cargo run --locked -q -p cheatarium-client --bin cheatarium-query -- native-switch --title-id 0100000000010000 --build-id B424BE150A8E7D78 --source-id sharkive --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total"] > 0 and not d["code_visible"] and all("code" not in row for row in d["results"])'
      - name: Validate local curation preview
        run: |
          python3 -m py_compile tools/curate_switch_private.py
          python3 -m unittest discover -s tools -p test_curate_switch_private.py
          python3 -m unittest discover -s tools -p test_fetch_smash_private.py
          python3 -m unittest discover -s tools -p test_curated_switch.py
          python3 -m unittest discover -s tools -p test_switch_exact_build_coverage.py
          python3 tools/reconcile_switch_exact_build_coverage.py --check
          python3 -m unittest discover -s tools -p test_save_switch_collection.py
          python3 tools/curate_switch_private.py --title-id 01006A800016E000

